<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="財報追蹤">
  <meta name="theme-color" content="#007AFF">
  <title>美股財報追蹤</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: #F2F2F7;
      min-height: 100vh;
      padding-bottom: max(env(safe-area-inset-bottom), 24px);
    }

    /* ── HEADER ── */
    .app-header {
      background: #fff;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 0.5px solid rgba(0,0,0,0.12);
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    .hd-icon { flex-shrink: 0; display: block; }
    .hd-title { flex: 1; font-size: 19px; font-weight: 700; color: #1C1C1E; }
    .icon-btn {
      width: 32px; height: 32px; border: none; background: transparent;
      font-size: 18px; color: #007AFF; cursor: pointer;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { opacity: 0.55; }
    .icon-btn.spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CONTENT ── */
    .content { padding: 20px 16px 0; max-width: 480px; margin: 0 auto; }

    /* ── ADD ROW ── */
    .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .sym-inp {
      flex: 1; padding: 11px 14px;
      border: 1.5px solid #E5E5EA; border-radius: 12px;
      font-size: 15px; font-weight: 500; letter-spacing: 0.5px;
      background: #fff; outline: none; text-transform: uppercase;
    }
    .sym-inp:focus { border-color: #007AFF; }
    .add-btn {
      width: 44px; height: 44px; flex-shrink: 0;
      background: #007AFF; color: #fff; border: none;
      border-radius: 12px; font-size: 26px; font-weight: 300;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .add-btn:active { opacity: 0.7; }

    /* ── NOTIF BANNER ── */
    .notif-bar {
      background: #EBF3FF; border-radius: 12px;
      padding: 10px 14px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .notif-bar p { flex: 1; font-size: 13px; color: #1C1C1E; line-height: 1.4; }
    .notif-bar button {
      background: #007AFF; color: #fff; border: none;
      border-radius: 8px; padding: 7px 14px; font-size: 13px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
    }

    /* ── LEGEND ── */
    .legend { display: flex; gap: 14px; padding: 0 2px; margin-bottom: 14px; }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #8E8E93; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .d-r { background: #FF3B30; }
    .d-o { background: #FF9500; }
    .d-g { background: #34C759; }

    /* ── STOCK CARD ── */
    .card {
      background: #fff; border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .card-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2px;
    }
    .sym { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    .sym.cr { color: #FF3B30; }
    .sym.co { color: #FF9500; }
    .sym.cg { color: #34C759; }
    .sym.cx { color: #8E8E93; }
    .del-btn {
      width: 28px; height: 28px; border: none; background: transparent;
      color: #FF3B30; opacity: 0.65; font-size: 14px;
      cursor: pointer; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .del-btn:active { opacity: 1; background: #FFE8E8; }
    .co-name { font-size: 12px; color: #8E8E93; margin-bottom: 10px; }
    .card-foot { display: flex; justify-content: space-between; align-items: flex-end; }
    .price-block { display: flex; align-items: baseline; gap: 7px; }
    .price { font-size: 19px; font-weight: 600; color: #1C1C1E; }
    .chg { font-size: 13px; font-weight: 500; }
    .chg.up { color: #34C759; }
    .chg.dn { color: #FF3B30; }
    .days-block { text-align: right; }
    .days-num { font-size: 28px; font-weight: 700; line-height: 1; }
    .days-num.cr { color: #FF3B30; }
    .days-num.co { color: #FF9500; }
    .days-num.cg { color: #34C759; }
    .days-num.cx { color: #C7C7CC; }
    .days-lbl { font-size: 11px; color: #8E8E93; margin-top: 3px; }
    .earn-dt  { font-size: 10px; color: #C7C7CC; margin-top: 2px; }

    /* ── SKELETON ── */
    .skel { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 10px; }
    .skel-l {
      background: #E5E5EA; border-radius: 4px; height: 12px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 60px 20px; color: #8E8E93; }
    .empty-icon { font-size: 46px; margin-bottom: 14px; }
    .empty-title { font-size: 16px; color: #3C3C43; margin-bottom: 6px; }
    .empty-sub { font-size: 13px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(28,28,30,.88); color: #fff;
      padding: 9px 18px; border-radius: 18px; font-size: 14px;
      z-index: 9999; opacity: 0; pointer-events: none;
      transition: opacity .25s; max-width: 88vw; text-align: center;
    }
    .toast.on { opacity: 1; }

    /* ── MODAL ── */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; z-index: 1000; padding: 16px;
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
    }
    .modal-box {
      background: #fff; border-radius: 20px; padding: 28px 24px 24px;
      width: 100%; max-width: 480px; margin: 0 auto;
    }
    .modal-ttl { font-size: 20px; font-weight: 700; color: #1C1C1E; margin-bottom: 6px; }
    .modal-desc { font-size: 14px; color: #8E8E93; line-height: 1.5; margin-bottom: 20px; }
    .modal-inp {
      width: 100%; padding: 13px 14px; margin-bottom: 14px;
      border: 1.5px solid #E5E5EA; border-radius: 12px;
      font-size: 15px; font-family: monospace; letter-spacing: .5px; outline: none;
    }
    .modal-inp:focus { border-color: #007AFF; }
    .modal-cta {
      width: 100%; padding: 14px; background: #007AFF; color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .modal-link {
      display: block; text-align: center; margin-top: 14px;
      font-size: 13px; color: #007AFF; text-decoration: none;
    }


    /* ── LIST LAYOUT ── */
    .list-wrap { background:#fff;border-radius:14px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.08); }
    .col-header { display:grid;grid-template-columns:14px 1fr 1fr 72px 26px;padding:5px 10px 4px;border-bottom:0.5px solid rgba(0,0,0,0.06); }
    .col-header span { font-size:10px;color:#C7C7CC; }
    .stock-row { display:grid;grid-template-columns:14px 1fr 1fr 72px 26px;align-items:center;padding:9px 10px;border-bottom:0.5px solid rgba(0,0,0,0.06); }
    .stock-row:last-child { border-bottom:none; }
    .urgency-bar { width:3px;height:34px;border-radius:2px; }
    /* Standalone color text classes */
    .cr { color: #FF3B30; }
    .co { color: #FF9500; }
    .cg { color: #34C759; }
    .cx { color: #C7C7CC; }
    .urgency-bar.cr { background:#FF3B30; }
    .urgency-bar.co { background:#FF9500; }
    .urgency-bar.cg { background:#34C759; }
    .urgency-bar.cx { background:#C7C7CC; }
    .row-info { padding-left:6px;min-width:0; }
    .row-sym { font-size:14px;font-weight:700;letter-spacing:0.3px; }
    .row-name { font-size:11px;color:#8E8E93;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .row-price-col { text-align:right;padding-right:8px;min-width:0; }
    .row-price { font-size:13px;font-weight:600;color:#1C1C1E;white-space:nowrap; }
    .row-chg { font-size:11px;margin-top:1px;white-space:nowrap; }
    .row-days-col { text-align:right; }
    .row-days { font-size:18px;font-weight:700;line-height:1.1; }
    .row-days.small { font-size:13px;font-weight:600; }
    .row-date { font-size:10px;color:#C7C7CC;margin-top:1px; }
    .row-del { width:24px;height:24px;border:none;background:transparent;color:#FF3B30;opacity:0.5;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;padding:0;margin:0 auto; }
    .row-del:active { opacity:1;background:#FFE8E8; }

    /* ── OCR 截圖導入 ── */
    .ocr-row { display:flex; gap:8px; margin-bottom:10px; }
    .ocr-btn {
      flex:1; padding:10px 8px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.14);
      border-radius:12px;
      color:rgba(255,255,255,0.7);
      font-size:13px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:5px;
      transition:all 0.2s;
    }
    .ocr-btn:active { background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.3); }
    .ocr-btn:disabled { opacity:0.4; cursor:not-allowed; }
    .ocr-progress {
      background:rgba(0,230,118,0.1);
      border:1px solid rgba(0,230,118,0.2);
      border-radius:10px; padding:8px 12px; margin-bottom:10px;
      font-size:12px; color:rgba(0,230,118,0.9);
      display:flex; align-items:center; gap:8px;
    }
    .ocr-spinner { animation:spin 0.8s linear infinite; display:inline-block; }
    .ticker-grid { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
    .t-chip {
      display:flex; align-items:center; gap:5px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:20px; padding:7px 13px;
      cursor:pointer; transition:all 0.2s; user-select:none;
    }
    .t-chip.on {
      background:rgba(0,230,118,0.15);
      border-color:rgba(0,230,118,0.45);
    }
    .t-chip span { font-size:13px; font-weight:600; color:rgba(255,255,255,0.88); }
    .t-chip.on span { color:#00E676; }
    .t-chip input { display:none; }
    .ocr-acts { display:flex; gap:8px; margin-top:4px; }
    .ocr-cancel {
      flex:1; padding:13px; background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.15); border-radius:12px;
      color:rgba(255,255,255,0.55); font-size:15px; cursor:pointer;
    }
    .ocr-add {
      flex:2; padding:13px; background:#007AFF;
      border:none; border-radius:12px;
      color:#fff; font-size:15px; font-weight:600; cursor:pointer;
    }
    .ocr-add:disabled { opacity:0.4; cursor:not-allowed; }
    .key-label { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:5px; }
    .key-links { display:flex; justify-content:space-between; margin-top:14px; }
    .key-links a { font-size:12px; color:rgba(120,170,255,0.85); text-decoration:none; }
    /* ── UTILS ── */
    .hidden { display: none !important; }
    .update-ts { text-align: center; font-size: 11px; color: #C7C7CC; padding: 6px 0 4px; }

    /* ═══════════════════════════════════
       GLASSMORPHISM FINTECH THEME
       紅=3天 黃=7天 綠=8天以上
       ═══════════════════════════════════ */
    body {
      background: #080C1F !important;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(150deg, #080C24 0%, #0D1548 45%, #190930 100%);
      z-index: -1;
    }
    .app-header {
      background: rgba(8,12,36,0.72) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border-bottom: 1px solid rgba(255,255,255,0.09) !important;
      box-shadow: 0 1px 24px rgba(0,0,0,0.5) !important;
    }
    .hd-title { color: #FFFFFF !important; }
    .icon-btn { color: rgba(160,185,255,0.75) !important; }
    .sym-inp {
      background: rgba(255,255,255,0.07) !important;
      border-color: rgba(255,255,255,0.13) !important;
      color: #FFFFFF !important;
    }
    .sym-inp::placeholder { color: rgba(255,255,255,0.28) !important; }
    .sym-inp:focus { border-color: rgba(100,150,255,0.45) !important; }
    .notif-bar {
      background: rgba(0,100,255,0.1) !important;
      border: 1px solid rgba(0,122,255,0.2) !important;
    }
    .notif-bar p { color: rgba(255,255,255,0.65) !important; }
    .leg { color: rgba(255,255,255,0.45) !important; }

    /* Color overrides: 橙色→黃色, 強化綠色 */
    .cr { color: #FF4444 !important; }
    .co { color: #FFD600 !important; }
    .cg { color: #00E676 !important; }
    .cx { color: rgba(255,255,255,0.28) !important; }
    .sym.cr,.sym.co,.sym.cg,.sym.cx { color: inherit !important; }
    .d-r { background: #FF4444 !important; }
    .d-o { background: #FFD600 !important; }
    .d-g { background: #00E676 !important; }

    /* Glassmorphism list card */
    .list-wrap {
      background: rgba(255,255,255,0.05) !important;
      backdrop-filter: blur(18px) !important;
      -webkit-backdrop-filter: blur(18px) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 18px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07) !important;
    }
    .col-header { border-bottom: 1px solid rgba(255,255,255,0.07) !important; }
    .col-header span { color: rgba(255,255,255,0.22) !important; }
    .stock-row { border-bottom: 1px solid rgba(255,255,255,0.05) !important; }
    .row-price { color: rgba(255,255,255,0.9) !important; }
    .row-name { color: rgba(255,255,255,0.32) !important; }
    .row-date { color: rgba(255,255,255,0.22) !important; }
    .row-del { color: rgba(255,80,80,0.45) !important; }
    .row-del:active { background: rgba(255,68,68,0.12) !important; }

    /* Urgency bars with glow */
    .urgency-bar.cr { background:#FF4444 !important; box-shadow:0 0 10px rgba(255,68,68,0.65) !important; }
    .urgency-bar.co { background:#FFD600 !important; box-shadow:0 0 10px rgba(255,214,0,0.65) !important; }
    .urgency-bar.cg { background:#00E676 !important; box-shadow:0 0 10px rgba(0,230,118,0.65) !important; }
    .urgency-bar.cx { background:rgba(255,255,255,0.18) !important; box-shadow:none !important; }

    .chg.up { color: #00E676 !important; }
    .chg.dn { color: #FF4444 !important; }

    /* Skeleton */
    .skel-l { background: rgba(255,255,255,0.08) !important; }
    .empty-icon { filter: brightness(0) invert(1) opacity(0.3); }
    .empty-title { color: rgba(255,255,255,0.6) !important; }
    .empty-sub { color: rgba(255,255,255,0.3) !important; }

    /* Glassmorphism modal */
    .modal {
      background: rgba(0,0,0,0.6) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
    }
    .modal-box {
      background: rgba(13,22,72,0.88) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
    }
    .modal-ttl { color: #FFFFFF !important; }
    .modal-desc { color: rgba(255,255,255,0.42) !important; }
    .modal-inp {
      background: rgba(255,255,255,0.08) !important;
      border-color: rgba(255,255,255,0.14) !important;
      color: #FFFFFF !important;
    }
    .modal-inp:focus { border-color: rgba(100,160,255,0.5) !important; }
    .modal-link { color: rgba(120,170,255,0.85) !important; }

    /* Toast */
    .toast {
      background: rgba(10,15,45,0.9) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
    }
    .update-ts { color: rgba(255,255,255,0.18) !important; }
  </style>
</head>
<body>

<header class="app-header">
  <svg class="hd-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="28" height="28" rx="6" fill="#080E28"/>
      <rect width="28" height="28" rx="6" fill="url(#hg)"/>
      <defs>
        <linearGradient id="hg" x1="14" y1="0" x2="14" y2="28" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="white" stop-opacity="0.08"/>
          <stop offset="1" stop-color="white" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="7"  y1="22" x2="7"  y2="15" stroke="#FF4444" stroke-width="1"/>
      <rect x="5.5" y="16.5" width="3" height="5.5" rx="0.5" fill="#FF4444"/>
      <line x1="13" y1="20" x2="13" y2="11" stroke="#00DC6E" stroke-width="1"/>
      <rect x="11.5" y="12.5" width="3" height="7.5" rx="0.5" fill="#00DC6E"/>
      <line x1="19" y1="19" x2="19" y2="12" stroke="#FF4444" stroke-width="1"/>
      <rect x="17.5" y="14" width="3" height="5" rx="0.5" fill="#FF4444"/>
      <line x1="25" y1="14" x2="25" y2="7" stroke="#00DC6E" stroke-width="1"/>
      <rect x="23.5" y="8" width="3" height="6" rx="0.5" fill="#00DC6E"/>
      <line x1="3" y1="25" x2="26" y2="3" stroke="#00FF88" stroke-width="1.8" stroke-linecap="round"/>
      <polygon points="26,3 22,5 24,8" fill="#00FF88"/>
      <rect width="28" height="28" rx="6" fill="none" stroke="rgba(80,160,255,0.35)" stroke-width="0.8"/>
    </svg>
  <h1 class="hd-title">美股財報追蹤</h1>
  <button class="icon-btn" onclick="openSettings()" title="設定">⚙️</button>
  <button class="icon-btn" id="refreshBtn" onclick="forceRefresh()" title="重新整理">↻</button>
</header>

<div class="content">
  <div class="add-row">
    <input class="sym-inp" id="symInp" type="text"
      placeholder="輸入股票代碼 (例如: AAPL)"
      maxlength="10" autocomplete="off" autocorrect="off"
      autocapitalize="characters" spellcheck="false">
    <button class="add-btn" onclick="handleAdd()">＋</button>
  </div>

  <!-- OCR 截圖導入 -->
  <div class="ocr-row">
    <button class="ocr-btn" id="ocrCamBtn" onclick="triggerOCR('camera')">📷 拍照識別</button>
    <button class="ocr-btn" id="ocrGalBtn" onclick="triggerOCR('gallery')">🖼️ 選擇截圖</button>
  </div>
  <input type="file" id="ocrCamera"  accept="image/*" capture="environment" style="display:none" onchange="handleOCRChange(this)">
  <input type="file" id="ocrGallery" accept="image/*"                        style="display:none" onchange="handleOCRChange(this)">
  <div class="ocr-progress hidden" id="ocrProgress">
    <span class="ocr-spinner">◌</span>
    <span id="ocrProgressText">OCR 辨識中...</span>
  </div>

  <div class="notif-bar" id="notifBar">
    <p>🔔 開啟推播通知，財報前自動提醒（需加入主畫面）</p>
    <button onclick="requestNotif()">開啟</button>
  </div>

  <div class="legend">
    <span class="leg"><span class="dot d-r"></span>≤1週</span>
    <span class="leg"><span class="dot d-o"></span>1-3週</span>
    <span class="leg"><span class="dot d-g"></span>&gt;3週</span>
  </div>

  <div id="stockList"></div>
  <p class="update-ts" id="updateTs"></p>
</div>

<!-- API Key Modal -->
<div class="modal hidden" id="keyModal">
  <div class="modal-box">
    <div class="modal-ttl">🔑 API Key 設定</div>
    <div class="modal-desc">Key 只儲存在您的手機本地，不會上傳到任何伺服器。</div>
    <div class="key-label">Finnhub（股價 + 財報日期）</div>
    <input class="modal-inp" id="keyInp" type="text" placeholder="Finnhub API Key...">
    <div class="key-label" style="margin-top:10px">OCR.space（截圖識別）</div>
    <input class="modal-inp" id="ocrKeyInp" type="text" placeholder="OCR.space API Key...">
    <button class="modal-cta" onclick="saveKey()">儲存</button>
    <div class="key-links">
      <a href="https://finnhub.io/register" target="_blank">申請 Finnhub →</a>
      <a href="https://ocr.space/OCRAPI" target="_blank">申請 OCR.space →</a>
    </div>
  </div>
</div>

<!-- OCR 確認 Modal -->
<div class="modal hidden" id="ocrModal">
  <div class="modal-box">
    <div class="modal-ttl">🔍 偵測到的股票代碼</div>
    <div class="modal-desc">點選要加入追蹤清單的代碼（已選 <span id="ocrSelCount">0</span> 支）</div>
    <div class="ticker-grid" id="tickerGrid"></div>
    <div class="ocr-acts">
      <button class="ocr-cancel" onclick="hideEl('ocrModal')">取消</button>
      <button class="ocr-add" id="ocrAddBtn" onclick="addSelectedTickers()" disabled>加入選取</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────
const FINN = 'https://finnhub.io/api/v1'

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let list = []
let data = {}
let busy = false

// ─────────────────────────────────────────
// STORAGE
// ─────────────────────────────────────────
const ls = {
  get:    k     => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
  set:    (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
  remove: k     => localStorage.removeItem(k)
}

// ─────────────────────────────────────────
// DATE HELPERS
// ─────────────────────────────────────────
const isoToday = () => new Date().toISOString().split('T')[0]
const isoAhead  = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0] }

function daysTo(dateStr) {
  if (!dateStr) return null
  const now = new Date(); now.setHours(0,0,0,0)
  const tgt = new Date(dateStr); tgt.setHours(0,0,0,0)
  const diff = Math.round((tgt - now) / 86400000)
  return diff >= 0 ? diff : null
}

function colorKey(days) {
  if (days === null) return 'x'
  if (days <= 7)  return 'r'   // 紅：7天內（1週內）
  if (days <= 21) return 'o'   // 黃：8-21天（1-3週）
  return 'g'                   // 綠：22天以上（3週以上）
}

// ─────────────────────────────────────────
// TOAST / MODAL / LOADING
// ─────────────────────────────────────────
let tTimer
function toast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.classList.add('on')
  clearTimeout(tTimer)
  tTimer = setTimeout(() => el.classList.remove('on'), 3500)
}

const showEl = id => document.getElementById(id).classList.remove('hidden')
const hideEl = id => document.getElementById(id).classList.add('hidden')

function setBusy(v) {
  busy = v
  const btn = document.getElementById('refreshBtn')
  btn.classList.toggle('spin', v)
  btn.disabled = v
}

// ─────────────────────────────────────────
// 判斷是否 Key 無效（只有真的 auth 錯誤才清 Key）
// ─────────────────────────────────────────
function isAuthError(res) {
  if (Array.isArray(res)) return false
  const msg = (res?.['Error Message'] || res?.message || '').toLowerCase()
  return msg.includes('invalid api key')
}

// ─────────────────────────────────────────
// ─────────────────────────────────────────
// FINNHUB PER-SYMBOL 精準查詢（大量查詢的補充）
// 大量查詢有結果數限制，直接用 symbol 參數補抓漏掉的
// ─────────────────────────────────────────
async function fetchFinnhubEarningsBySymbol(sym, apiKey) {
  try {
    const res = await fetch(
      `${FINN}/calendar/earnings?symbol=${sym}&from=${isoToday()}&to=${isoAhead(180)}&token=${apiKey}`
    )
    if (!res.ok) return null
    const json = await res.json()
    const calendar = json?.earningsCalendar || []
    const today = isoToday()
    const upcoming = calendar
      .filter(e => e.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date))
    return upcoming[0]?.date || null
  } catch {
    return null
  }
}

// FETCH DATA（Finnhub + Yahoo Finance 備援）
// 使用 /stable/profile（EOD 收盤價 + 公司名稱）
// 使用 /stable/earnings-calendar（財報日曆）
// 共 2 次 API 呼叫 / 天，遠低於 250 次上限
// ─────────────────────────────────────────
async function fetchData(force = false) {
  const apiKey = ls.get('apiKey')
  if (!apiKey) { showEl('keyModal'); return }
  if (list.length === 0) { render(); return }
  if (busy) return

  // 今天已抓過就用快取
  if (!force) {
    const cache = ls.get('cache')
    if (cache?.date === isoToday()) {
      data = cache.data || {}
      render(); setTs(cache.date); return
    }
  }

  try {
    setBusy(true)
    renderSkeleton()

    const today   = isoToday()
    const ahead90 = isoAhead(90)
    const nameCache = ls.get('nameCache') || {}

    // ── 1. 股價：每支股票一次呼叫，全部平行發出 ──
    // Finnhub quote: { c: price, dp: changePercent% }
    const quotePromises = list.map(sym =>
      fetch(`${FINN}/quote?symbol=${sym}&token=${apiKey}`)
        .then(async r => {
          if (r.status === 401 || r.status === 403) throw new Error('AUTH')
          const d = await r.json()
          return { sym, price: d.c || null, chg: d.dp ?? null }
        })
        .catch(e => { if (e.message === 'AUTH') throw e; return { sym, price: null, chg: null } })
    )

    // ── 2. 財報日曆：一次取 90 天，client 端過濾 ──
    const earningsPromise = fetch(
      `${FINN}/calendar/earnings?from=${today}&to=${ahead90}&token=${apiKey}`
    ).then(r => r.ok ? r.json() : { earningsCalendar: [] })
     .catch(() => ({ earningsCalendar: [] }))

    // ── 3. 公司名稱：只抓還沒快取的新股票 ──
    const newSyms = list.filter(s => !nameCache[s])
    const namePromises = newSyms.map(sym =>
      fetch(`${FINN}/stock/profile2?symbol=${sym}&token=${apiKey}`)
        .then(r => r.json())
        .then(d => ({ sym, name: d.name || sym }))
        .catch(() => ({ sym, name: sym }))
    )

    const [quotes, earningsRes, names] = await Promise.all([
      Promise.all(quotePromises),
      earningsPromise,
      Promise.all(namePromises)
    ])

    // 更新公司名稱快取
    names.forEach(({ sym, name }) => { nameCache[sym] = name })
    ls.set('nameCache', nameCache)

    // 建立 earnings map
    const eMap = {}
    const calendar = earningsRes?.earningsCalendar || []
    calendar.forEach(e => {
      if (list.includes(e.symbol)) {
        if (!eMap[e.symbol] || e.date < eMap[e.symbol]) eMap[e.symbol] = e.date
      }
    })

    // ── 4. Yahoo Finance 備援：補上 Finnhub 沒有的財報日期 ──
    // ── 4. Per-symbol 精準補查：大量查詢沒撈到的股票再查一次 ──
    const missingSyms = list.filter(sym => !eMap[sym])
    if (missingSyms.length > 0) {
      const fallbackResults = await Promise.all(
        missingSyms.map(sym => fetchFinnhubEarningsBySymbol(sym, apiKey))
      )
      missingSyms.forEach((sym, i) => {
        if (fallbackResults[i]) eMap[sym] = fallbackResults[i]
      })
    }

    // ── 5. 合併資料 ──
    const fresh = {}
    quotes.forEach(({ sym, price, chg }) => {
      fresh[sym] = { name: nameCache[sym] || sym, price, chg, earn: eMap[sym] || null }
    })

    data = fresh
    ls.set('cache', { date: today, data: fresh })
    setTs(today)
    render()

  } catch (err) {
    if (err.message === 'AUTH') {
      ls.remove('apiKey'); showEl('keyModal')
      toast('⚠️ API Key 無效，請重新輸入 Finnhub Key')
    } else {
      toast('⚠️ ' + (err.message || '資料載入失敗'))
      render()
    }
  } finally {
    setBusy(false)
  }
}

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function renderSkeleton() {
  const rows = Array(Math.min(list.length, 5)).fill('').map(() => `
    <div class="stock-row">
      <div class="urgency-bar cx"></div>
      <div class="row-info">
        <div class="skel-l" style="width:44px;height:13px;margin-bottom:4px;border-radius:3px"></div>
        <div class="skel-l" style="width:70px;height:10px;border-radius:3px"></div>
      </div>
      <div class="row-price-col">
        <div class="skel-l" style="width:55px;height:13px;margin-bottom:4px;border-radius:3px;margin-left:auto"></div>
        <div class="skel-l" style="width:38px;height:10px;border-radius:3px;margin-left:auto"></div>
      </div>
      <div class="row-days-col">
        <div class="skel-l" style="width:40px;height:18px;margin-bottom:3px;border-radius:3px;margin-left:auto"></div>
        <div class="skel-l" style="width:32px;height:9px;border-radius:3px;margin-left:auto"></div>
      </div>
      <div></div>
    </div>`).join('')
  document.getElementById('stockList').innerHTML =
    `<div class="list-wrap">${rows}</div>`
}

function render() {
  const el = document.getElementById('stockList')

  if (list.length === 0) {
    el.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📈</div>
        <p class="empty-title">追蹤清單是空的</p>
        <p class="empty-sub">輸入股票代碼開始追蹤財報日期</p>
      </div>`
    return
  }

  const sorted = [...list].sort((a, b) => {
    const da = daysTo(data[a]?.earn)
    const db = daysTo(data[b]?.earn)
    if (da === null && db === null) return 0
    if (da === null) return 1
    if (db === null) return -1
    return da - db
  })

  const rows = sorted.map(sym => {
    const d = data[sym]
    if (!d) return rowPending(sym)

    const days   = daysTo(d.earn)
    const ck     = colorKey(days)
    const up     = (d.chg ?? 0) >= 0
    const chgStr = d.chg  != null ? `${up ? '+' : ''}${d.chg.toFixed(2)}%` : '—'
    const pStr   = d.price != null ? `$${d.price.toFixed(2)}`               : '—'
    let dStr
    if (days === null)   dStr = '待公布'
    else if (days <= 7)  dStr = `${days}天`          // 紅色區：保留天數，強調急迫
    else                 dStr = `${Math.round(days / 7)}週`  // 黃/綠色區：顯示週數
    const dClass = (days !== null && days >= 100) ? 'row-days small' : 'row-days'
    const dateStr = d.earn ? d.earn.slice(5) : ''

    return `
      <div class="stock-row">
        <div class="urgency-bar c${ck}"></div>
        <div class="row-info">
          <div class="row-sym c${ck}">${sym}</div>
          <div class="row-name">${d.name || sym}</div>
        </div>
        <div class="row-price-col">
          <div class="row-price">${pStr}</div>
          <div class="row-chg ${up ? 'up' : 'dn'}">${chgStr}</div>
        </div>
        <div class="row-days-col">
          <div class="${dClass} c${ck}">${dStr}</div>
          <div class="row-date">${dateStr}</div>
        </div>
        <button class="row-del" onclick="removeStock('${sym}')">🗑</button>
      </div>`
  })

  el.innerHTML = `
    <div class="list-wrap">
      <div class="col-header">
        <span></span>
        <span style="padding-left:6px">名稱</span>
        <span style="text-align:right;padding-right:8px">現價</span>
        <span style="text-align:right">距財報</span>
        <span></span>
      </div>
      ${rows.join('')}
    </div>`
}

function rowPending(sym) {
  return `
    <div class="stock-row">
      <div class="urgency-bar cx"></div>
      <div class="row-info">
        <div class="row-sym cx">${sym}</div>
        <div class="row-name">載入中...</div>
      </div>
      <div class="row-price-col">
        <div class="row-price" style="color:#C7C7CC">—</div>
      </div>
      <div class="row-days-col">
        <div class="row-days cx" style="font-size:14px">...</div>
      </div>
      <button class="row-del" onclick="removeStock('${sym}')">🗑</button>
    </div>`
}

function setTs(date) {
  document.getElementById('updateTs').textContent = `資料日期：${date}`
}

// ─────────────────────────────────────────
// ADD / REMOVE
// ─────────────────────────────────────────
function handleAdd() {
  const inp = document.getElementById('symInp')
  const sym = inp.value.trim().toUpperCase().replace(/[^A-Z.]/g, '')
  if (!sym) return
  if (!/^[A-Z]{1,5}(\\.[A-Z])?$/.test(sym)) {
    toast('請輸入有效的美股代碼（例如 AAPL、BRK.A）'); return
  }
  if (list.includes(sym)) {
    toast(`${sym} 已在追蹤清單中`); inp.value = ''; return
  }
  list = [...list, sym]
  ls.set('watchlist', list)
  inp.value = ''
  ls.remove('cache')
  fetchData()
}

function removeStock(sym) {
  list = list.filter(s => s !== sym)
  ls.set('watchlist', list)
  delete data[sym]
  const cache = ls.get('cache')
  if (cache?.data) { delete cache.data[sym]; ls.set('cache', cache) }
  render()
  toast(`已移除 ${sym}`)
}

function forceRefresh() {
  ls.remove('cache')
  fetchData(true)
}

// ─────────────────────────────────────────
// API KEY 設定
// ─────────────────────────────────────────
function openSettings() {
  document.getElementById('keyInp').value    = ls.get('apiKey') || ''
  document.getElementById('ocrKeyInp').value = ls.get('ocrKey') || ''
  showEl('keyModal')
}

function saveKey() {
  const finnhubKey = document.getElementById('keyInp').value.trim()
  const ocrKey     = document.getElementById('ocrKeyInp').value.trim()
  if (!finnhubKey || finnhubKey.length < 8) { toast('請輸入有效的 Finnhub Key'); return }
  ls.set('apiKey', finnhubKey)
  if (ocrKey) ls.set('ocrKey', ocrKey)
  hideEl('keyModal')
  ls.remove('cache')
  fetchData(true)
}

document.getElementById('keyModal').addEventListener('click', function(e) {
  if (e.target === this && ls.get('apiKey')) hideEl('keyModal')
})

// ─────────────────────────────────────────
// 推播通知（Phase 2）
// ─────────────────────────────────────────
async function requestNotif() {
  if (!('Notification' in window)) { toast('此瀏覽器不支援推播通知'); return }
  const perm = await Notification.requestPermission()
  if (perm === 'granted') {
    hideEl('notifBar'); ls.set('notifOk', true)
    toast('✅ 通知已開啟！')
  } else {
    toast('請在瀏覽器或系統設定中允許通知')
  }
}

// ─────────────────────────────────────────
// SERVICE WORKER
// ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.error)
}

// ─────────────────────────────────────────
// KEYBOARD
// ─────────────────────────────────────────
document.getElementById('symInp').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleAdd()
})


// ─────────────────────────────────────────
// OCR 截圖導入（Tesseract.js）
// ─────────────────────────────────────────
// ─────────────────────────────────────────
// OCR.space API（取代 Tesseract.js）
// ─────────────────────────────────────────
async function ocrWithSpace(imageBlob) {
  const apiKey = ls.get('ocrKey')
  if (!apiKey) {
    openSettings()
    throw new Error('請先在設定中輸入 OCR.space API Key')
  }

  const form = new FormData()
  form.append('file', imageBlob, 'screenshot.png')
  form.append('language', 'eng')
  form.append('scale', 'true')
  form.append('OCREngine', '2')       // Engine 2：準確率較高
  form.append('isTable', 'false')
  form.append('detectOrientation', 'false')

  const res = await fetch('https://api.ocr.space/parse/image', {
    method: 'POST',
    headers: { 'apikey': apiKey },
    body: form
  })

  if (!res.ok) throw new Error(`OCR API 錯誤 ${res.status}`)

  const data = await res.json()

  if (data.IsErroredOnProcessing) {
    const msg = Array.isArray(data.ErrorMessage)
      ? data.ErrorMessage.join(', ')
      : (data.ErrorMessage || 'OCR 處理失敗')
    throw new Error(msg)
  }

  return data.ParsedResults?.[0]?.ParsedText || ''
}

// 過濾雜訊：排除常見非 ticker 英文縮寫
const NOISE = new Set([
  'THE','AND','FOR','USD','TWD','ETF','INC','CORP','LTD','LLC',
  'NFT','API','IPO','EPS','CEO','CFO','CTO','ATH','ATL','NYSE',
  'NASDAQ','OR','OF','IS','AT','BY','TO','IN','ON','BE','DO','GO',
  'AM','PM','HK','US','CN','EU','GB','AU','JP','KR','TW','AI',
  'IT','HR','PR','FY','QE','QQ','PE','PB','EV','ROE','ROI',
  'MKT','CAP','VOL','AVG','MAX','MIN','DAY','WEEK','OPEN','HIGH','LOW',
  'SELL','BUY','HOLD','MARK','FUND','ETF','ADR','GDR'
])

function extractTickers(text) {
  const raw = []
  const lines = text.split('\n')

  for (const line of lines) {
    const t = line.trim()
    if (!t) continue

    // 跳過含數字的行（價格、漲跌幅行）
    if (/[\d]/.test(t)) continue

    // 修法2：最多 5 個字母（HEBIEH=6字 直接過濾）
    // 整行 = 一個 ticker（Futu 最常見格式）
    if (/^[A-Z]{2,5}(\.[AB])?$/.test(t) && !NOISE.has(t)) {
      raw.push(t); continue
    }

    // 行首大寫英文詞，後面接非大寫開頭（emoji、空格、小寫）→ ticker
    // 修法4：如果後面接著另一個大寫英文詞 → 是公司名（MACOM Technology...），跳過
    const m = t.match(/^([A-Z]{2,5}(\.[AB])?)(?=\s|$)/)
    if (m && !NOISE.has(m[1])) {
      const rest = t.slice(m[1].length).trim()
      // 若後面緊跟著另一個大寫英文詞，判斷為公司英文名稱，跳過
      if (/^[A-Z][a-z]/.test(rest) || /^[A-Z]{2,}/.test(rest)) continue
      raw.push(m[1])
    }
  }

  const unique = [...new Set(raw)]

  // 修法3：去除前綴重複（NWPX 和 NWPXE → 留 NWPX）
  // 保護條件：短的至少 3 個字母才做去重，避免 2 字母 ticker 誤刪
  return unique.filter(t =>
    !unique.some(other =>
      other !== t &&
      other.length < t.length &&
      other.length >= 3 &&
      t.startsWith(other)
    )
  )
}




// Canvas 自動裁切：
//   左側 40%  → 排除 Sparkline 圖和價格欄
//   頂部 15%  → 排除狀態列、分頁 Tab 等介面文字（EHR、FE 來源）
function cropLeft40(file) {
  return new Promise((resolve, reject) => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      const cropW  = Math.floor(img.width  * 0.40)
      const skipTop = Math.floor(img.height * 0.15)
      const cropH  = img.height - skipTop
      const canvas = document.createElement('canvas')
      canvas.width  = cropW
      canvas.height = cropH
      canvas.getContext('2d').drawImage(
        img,
        0, skipTop, cropW, cropH,  // 來源：從 skipTop 開始，取 cropW x cropH
        0, 0,       cropW, cropH   // 目的：貼到 canvas 左上角
      )
      URL.revokeObjectURL(url)
      canvas.toBlob(
        blob => blob ? resolve(blob) : reject(new Error('Canvas crop 失敗')),
        'image/png'
      )
    }
    img.onerror = () => reject(new Error('圖片載入失敗'))
    img.src = url
  })
}

function triggerOCR(mode) {
  document.getElementById(mode === 'camera' ? 'ocrCamera' : 'ocrGallery').click()
}

async function handleOCRChange(input) {
  const file = input.files[0]
  input.value = ''  // reset so same file can be reselected
  if (!file) return

  // 顯示進度條，禁用按鈕
  document.getElementById('ocrCamBtn').disabled = true
  document.getElementById('ocrGalBtn').disabled = true
  document.getElementById('ocrProgress').classList.remove('hidden')
  document.getElementById('ocrProgressText').textContent = '載入 OCR 引擎...'

  try {
    // 自動裁切：去掉頂部 15%（介面列）+ 只取左側 40%（排除 Sparkline 和價格欄）
    document.getElementById('ocrProgressText').textContent = '裁切圖片中...'
    const cropped = await cropLeft40(file)

    document.getElementById('ocrProgressText').textContent = '上傳至 OCR.space 辨識中...'
    const text = await ocrWithSpace(cropped)

    const tickers = extractTickers(text)

    if (tickers.length === 0) {
      toast('未偵測到股票代碼，請使用更清晰的截圖')
      return
    }

    showOCRConfirm(tickers)

  } catch (err) {
    toast('⚠️ OCR 失敗：' + (err.message || '未知錯誤'))
  } finally {
    document.getElementById('ocrProgress').classList.add('hidden')
    document.getElementById('ocrCamBtn').disabled = false
    document.getElementById('ocrGalBtn').disabled = false
  }
}

function showOCRConfirm(tickers) {
  const grid = document.getElementById('tickerGrid')
  grid.innerHTML = tickers.map(t => `
    <div class="t-chip on" onclick="toggleChip(this)" data-ticker="${t}">
      <span>${t}</span>
    </div>`).join('')

  updateOCRCount()
  showEl('ocrModal')
}

function toggleChip(el) {
  el.classList.toggle('on')
  updateOCRCount()
}

function updateOCRCount() {
  const selected = document.querySelectorAll('#tickerGrid .t-chip.on').length
  document.getElementById('ocrSelCount').textContent = selected
  document.getElementById('ocrAddBtn').disabled = selected === 0
}

function addSelectedTickers() {
  const chips = document.querySelectorAll('#tickerGrid .t-chip.on')
  const toAdd = [...chips]
    .map(c => c.dataset.ticker)
    .filter(t => !list.includes(t))

  if (toAdd.length === 0) {
    toast('選取的代碼已全部在清單中了')
    hideEl('ocrModal')
    return
  }

  list = [...list, ...toAdd]
  ls.set('watchlist', list)
  ls.remove('cache')
  hideEl('ocrModal')
  toast(`✅ 已加入 ${toAdd.length} 支：${toAdd.join(', ')}`)
  fetchData()
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
function init() {
  list = ls.get('watchlist') || []

  const notifHandled =
    !('Notification' in window) ||
    Notification.permission !== 'default' ||
    ls.get('notifOk')
  if (notifHandled) hideEl('notifBar')

  if (!ls.get('apiKey')) {
    showEl('keyModal'); hideEl('notifBar'); render(); return
  }
  hideEl('keyModal')
  fetchData()
}

init()
</script>
</body>
</html>
